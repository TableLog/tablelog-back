# 워크플로우 이름
name: Manual Build

# 워크플로우 트리거 설정
on:
  # 수동 실행 (GitHub Actions 탭에서 "Run workflow" 버튼으로 실행)
  workflow_dispatch:

# 실행할 작업 정의
jobs:
  # 빌드 작업
  build:
    # 실행 환경: 최신 Ubuntu
    runs-on: ubuntu-latest

    # 작업 단계 정의
    steps:
      # 1단계: 저장소 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2단계: Java 19 환경 설정
      - name: Set up JDK 19
        uses: actions/setup-java@v4
        with:
          java-version: "19" # Java 버전
          distribution: "temurin" # Java 배포판 (Temurin = OpenJDK)

      # 3단계: Gradle Wrapper 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4단계: Gradle 빌드 실행 (테스트 제외)
      # -x test: 테스트 태스크를 제외하고 빌드 실행
      # --no-daemon: 백그라운드 데몬 프로세스 없이 실행 (CI 환경에 적합)
      - name: Run Gradle build (skip tests)
        run: ./gradlew build -x test --no-daemon
