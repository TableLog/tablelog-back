# 워크플로우 이름
name: Manual Build

# 워크플로우 트리거 설정
on:
  # 수동 실행 (GitHub Actions 탭에서 "Run workflow" 버튼으로 실행)
  workflow_dispatch:

# 실행할 작업 정의
jobs:
  # 빌드 작업
  build:
    # 실행 환경: 최신 Ubuntu
    runs-on: ubuntu-latest

    # 작업 단계 정의
    steps:
      # 1단계: 저장소 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2단계: Java 19 환경 설정
      - name: Set up JDK 19
        uses: actions/setup-java@v4
        with:
          java-version: "19" # Java 버전
          distribution: "temurin" # Java 배포판 (Temurin = OpenJDK)

      # 3단계: Gradle Wrapper 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4단계: Gradle 빌드 실행 (테스트 제외)
      # -x test: 테스트 태스크를 제외하고 빌드 실행
      # --no-daemon: 백그라운드 데몬 프로세스 없이 실행 (CI 환경에 적합)
      - name: Run Gradle build (skip tests)
        run: ./gradlew build -x test --no-daemon

      # 5단계: Docker 이미지 빌드 및 푸시
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Debug - Check repository info
        run: |
          echo "🔍 저장소 소유자 (조직): ${{ github.repository_owner }}"
          echo "🔍 현재 워크플로우 실행자: ${{ github.actor }}"
          echo "🔍 저장소 이름: ${{ github.repository }}"
          echo ""
          echo "⚠️ 주의: github.repository_owner는 소문자로 변환될 수 있습니다."
          echo "✅ 명시적으로 TableLog를 사용합니다."
          echo "✅ 이미지가 푸시될 위치: ghcr.io/TableLog/tablelog-back"

      - name: Check token availability
        id: check_token
        run: |
          if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
            echo "token_available=true" >> $GITHUB_OUTPUT
            echo "✅ GHCR_TOKEN이 설정되어 있습니다."
            echo "✅ GHCR_TOKEN을 사용하여 로그인합니다."
          else
            echo "token_available=false" >> $GITHUB_OUTPUT
            echo "⚠️ GHCR_TOKEN이 설정되지 않았습니다."
            echo "⚠️ GITHUB_TOKEN을 사용합니다. (조직 저장소에서는 권한이 부족할 수 있습니다)"
            echo ""
            echo "💡 해결 방법:"
            echo "   1. Personal Access Token 생성 (권한: write:packages, read:packages)"
            echo "   2. 저장소 Settings → Secrets → Actions에 'GHCR_TOKEN'으로 추가"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # 조직 계정(TableLog)으로 로그인
          # github.repository_owner는 소문자로 변환될 수 있으므로 명시적으로 TableLog 사용
          username: TableLog
          password: ${{ steps.check_token.outputs.token_available == 'true' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 조직 계정(TableLog)으로 이미지 푸시
          # github.repository_owner는 소문자로 변환될 수 있으므로 명시적으로 TableLog 사용
          images: ghcr.io/TableLog/tablelog-back
          tags: |
            type=raw,value=latest
            type=sha,prefix=develop-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
